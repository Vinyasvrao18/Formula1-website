<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=2.0">
    <title>Formula 1</title>
    

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        
        body {
            font-family: sans-serif;
            margin: 0;
            background: url('https://wallpapercave.com/wp/wp3607781.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
        }

        header {
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 3rem 0;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0px 0px 10px red
        }

        nav ul {
            color: white;
            list-style: none;
            padding: 0;
            margin: 0;
        }

      

        nav li {
            display: inline;
            margin: 0 1rem;
        }

        nav a {
            padding:5px;    
            color: white;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        nav a:hover{
            color:red;
            transform:0.9;

        }
        


        #hero {
        padding: 20px;
        border-radius:8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 5px;
        margin:70px 300px;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        text-shadow:1px 2px 2px black;
        }

        .hero-content h2 {
        font-size: 3rem;
        }

        .hero-content button {
            background-color: rgb(255, 0, 0);
            color: rgb(254, 254, 254);
            border: none;
            padding: 1rem 2rem;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s ease;
        }

        .hero-content button:hover{

            transform:translateY(-3px)
            
        }



        footer {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 1rem 0;
            position: absolute;
            bottom: -50px;
            width: 100%;
        }

        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: black;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
        }
        .menu-button:hover{
            background-color:rgb(207, 75, 75);
            transform:scale(1.05);
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.9);
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 20px;
            color: white;
            display: block;
            transition: 0.3s;
            text-align: center;
        }

        .sidebar a:hover {
            background-color: red;
            transform:scale(1.1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 25px;
            color: white;
            cursor: pointer;
        }
        
    </style>
</head>

<body>
    <button class="menu-button" onclick="openMenu()">☰ Menu</button>
    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeMenu()">&times;</a>
        <a href="trial3.html">Home</a>
        <a href="3dmodel.html">3D Model</a>
        <a href="tracks.html">Races</a>
        <a href="teams.html">Teams</a>
        <a href="drivers.html">Drivers</a>
        <a href="rules.html">Rules</a>
        <a href="about.html">About</a>
    </div>
    
    <header>
        <h1>Formula 1</h1>
        <nav>
            <ul>
                <li><a href="#" onclick="navigateTo('3dmodel.html')">3D Model</a></li>
                <li><a href="#" onclick="navigateTo('tracks.html')">Races</a></li>
                <li><a href="#" onclick="navigateTo('teams.html')">Teams</a></li>
                <li><a href="#" onclick="navigateTo('drivers.html')">Drivers</a></li>
                <li><a href="#" onclick="navigateTo('rules.html')">Rules</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero">
            <div class="hero-content">
                <h2>Welcome to the World of F1</h2>
                <p>Experience the thrill of speed, the cutting-edge technology, and the intense rivalries.</p>
                <button onclick="navigateTo('about.html')">Learn More</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; Vinyas V Rao </p>
    </footer>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        function openMenu() {
            document.getElementById("sidebar").style.width = "250px";
        }

        function closeMenu() {
            document.getElementById("sidebar").style.width = "0";
        }
    </script>
</body>

</html>
